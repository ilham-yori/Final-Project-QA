name: QA Final Automation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ID: ${{ secrets.APP_ID }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for Gradle wrapper
      run: chmod +x gradlew

    - name: run API Test
      run: ./gradlew apiTest --no-daemon

    - name: run Web Test
      if: always()
      run: ./gradlew webTest --no-daemon

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
          name: test-results
          path: target/cucumber-report
